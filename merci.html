<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation confirmée — Ambulances Mira 91</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Raleway:wght@300;400&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0F1B47; font-family:'Raleway',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; }
.check { font-size:60px; margin-bottom:20px; }
h1 { font-family:'Cinzel',serif; color:#D4A920; font-size:24px; letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }
p { color:rgba(255,255,255,0.7); font-size:15px; line-height:1.8; max-width:340px; margin-bottom:30px; }
a { display:inline-block; color:#D4A920; border:2px solid #D4A920; padding:14px 36px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; text-decoration:none; transition:0.2s; }
a:hover { background:#D4A920; color:#0F1B47; }
</style>
</head>
<body>
<div class="check">✓</div>
<h1>Réservation confirmée</h1>
<p>Votre transport a bien été enregistré. Vous recevrez une confirmation par SMS sous 30 minutes.</p>
<a href="/">Nouvelle réservation</a>
</body>
</html>
